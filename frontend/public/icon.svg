<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#1E1E24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF5A1F"/>
      <stop offset="100%" stop-color="#FFB627"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Fork icon -->
  <g transform="translate(130, 80) scale(0.5)">
    <path d="M160 40 C160 40 140 160 160 200 L160 440 C160 460 180 480 200 480 L310 480 C330 480 350 460 350 440 L350 200 C370 160 350 40 350 40"
          fill="none" stroke="url(#accent)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="210" y1="40" x2="210" y2="160" stroke="url(#accent)" stroke-width="24" stroke-linecap="round"/>
    <line x1="260" y1="40" x2="260" y2="180" stroke="url(#accent)" stroke-width="24" stroke-linecap="round"/>
    <line x1="310" y1="40" x2="310" y2="160" stroke="url(#accent)" stroke-width="24" stroke-linecap="round"/>
  </g>
  <!-- FoodHunt text -->
  <text x="256" y="460" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="900" fill="url(#accent)">FoodHunt</text>
</svg>
