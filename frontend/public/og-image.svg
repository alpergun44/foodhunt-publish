<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#121F33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E23744"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E23744"/>
      <stop offset="50%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#E23744"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="600" width="1200" height="30" fill="url(#bar)"/>
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="#E23744" opacity="0.06"/>
  <circle cx="1100" cy="500" r="250" fill="#F5A623" opacity="0.05"/>
  <!-- Logo -->
  <text x="600" y="250" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="130" font-weight="900" fill="url(#accent)">FoodHunt</text>
  <text x="600" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="500" fill="#FFF5EB">Ne Yesem?</text>
  <text x="600" y="430" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" fill="#8899AA">Turnuva sistemiyle restoran sec!</text>
  <text x="600" y="130" text-anchor="middle" font-size="70">🍽️</text>
</svg>
