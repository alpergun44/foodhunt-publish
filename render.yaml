services:
  - type: web
    name: foodhunt
    runtime: node
    plan: free
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci
    startCommand: cd backend && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        value: FoodHunt2026Admin
      - key: JWT_EXPIRY
        value: "604800"
      - key: LOG_LEVEL
        value: info
